name: build

# 触发方式：
#   - 手动点 Run workflow（随时打一个包）
#   - push 到 main（自动验证能不能打包）
#   - 推 v* 标签（自动打包并发布到 Release）
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    name: Windows 便携版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: npm run check

      - name: 打包
        run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS dmg
    # 必须是 macOS 机器：dmg / codesign / 公证都依赖 macOS 自带工具
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: npm run check

      - name: 打包
        run: npm run package:mac
        env:
          # 没有证书时这几项都是空值，electron-builder 会跳过签名，产出未公证的包。
          # 拿到 Apple 开发者账号后，在仓库 Settings → Secrets 里填好，这里会自动签名 + 公证：
          #   CSC_LINK                       .p12 证书的 base64 或下载链接
          #   CSC_KEY_PASSWORD               证书密码
          #   APPLE_ID                       苹果账号邮箱（公证用）
          #   APPLE_APP_SPECIFIC_PASSWORD    专用密码（appleid.apple.com 生成）
          #   APPLE_TEAM_ID                  团队 ID
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 未配置证书时做 ad-hoc 签名说明
        if: env.CSC_LINK == ''
        run: |
          echo "::notice::本次产出的 app 未签名。Apple 芯片机器上首次打开若提示「已损坏」，执行："
          echo "::notice::xattr -cr /Applications/详情图工作台.app && codesign --force --deep --sign - /Applications/详情图工作台.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布到 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
